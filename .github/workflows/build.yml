name: Build APK

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package in this action's default list was
          # removed from the SDK repository; install only what we need below.
          packages: ''

      - name: Install platform and build tools
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: API 10 compile gate
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          curl -fsSL -o "$RUNNER_TEMP/android-2.3.3.jar" \
            https://repo1.maven.org/maven2/com/google/android/android/2.3.3/android-2.3.3.jar
          rm -rf "$RUNNER_TEMP/api10-classes"
          mkdir -p "$RUNNER_TEMP/api10-classes"
          javac -source 8 -target 8 \
            -bootclasspath "$RUNNER_TEMP/android-2.3.3.jar:$SDK/platforms/android-37.0/android.jar" \
            -encoding UTF-8 \
            -d "$RUNNER_TEMP/api10-classes" \
            $(find app/src -name '*.java')

      - name: Build and sign APK
        run: python3 tools/build.py

      - name: Record SHA-256
        working-directory: output
        run: sha256sum FilmStudioNex6-0.2.16-alpha.apk | tee SHA256SUMS.txt

      - name: Stage release files
        run: |
          mkdir -p dist
          cp output/FilmStudioNex6-0.2.16-alpha.apk dist/
          cp output/SHA256SUMS.txt dist/
          cp validation/FilmStudioNex6-0.2.16-alpha.json dist/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmStudioNex6-0.2.16-alpha-debug-signed
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: FilmStudioNex6-0.2.16-alpha-debug-signed
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Experimental Sony NEX-6 build from tag ${GITHUB_REF_NAME}.

          - Version: 0.2.16-alpha (versionCode 18), Android 2.3.7 / API 10
          - camera_tested=false: nothing has been validated on a real camera; see docs/VALIDATION.md
          - Keep the mode dial on P/A/S/M; iAuto and SCN let the camera override Creative Style and Picture Effect
          - Use DISP for the on-body log; card logs may read back as all NUL over USB/MTP

          CI signs this APK with a throwaway debug key, so it cannot update over a
          locally signed build and its SHA-256 differs from the one in the docs.
          Check SHA256SUMS.txt for this file.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "Film Studio NEX-6 0.2.16-alpha (CI debug build)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*.apk dist/SHA256SUMS.txt dist/*.json
