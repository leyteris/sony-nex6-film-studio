name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package in this action's default list was
          # removed from the SDK repository; install only what we need below.
          packages: ''

      - name: Install platform and build tools
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: API 10 compile gate
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          curl -fsSL -o "$RUNNER_TEMP/android-2.3.3.jar" \
            https://repo1.maven.org/maven2/com/google/android/android/2.3.3/android-2.3.3.jar
          rm -rf "$RUNNER_TEMP/api10-classes"
          mkdir -p "$RUNNER_TEMP/api10-classes"
          javac -source 8 -target 8 \
            -bootclasspath "$RUNNER_TEMP/android-2.3.3.jar:$SDK/platforms/android-37.0/android.jar" \
            -encoding UTF-8 \
            -d "$RUNNER_TEMP/api10-classes" \
            $(find app/src -name '*.java')

      - name: Build and sign APK
        run: python3 tools/build.py

      - name: Record SHA-256
        run: sha256sum output/FilmStudioNex6-0.2.12-alpha.apk | tee output/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmStudioNex6-0.2.12-alpha-debug-signed
          path: |
            output/FilmStudioNex6-0.2.12-alpha.apk
            output/SHA256SUMS.txt
            validation/FilmStudioNex6-0.2.12-alpha.json
          if-no-files-found: error
